; egazindex navbat ishchisi (queue:work) — supervisor konfiguratsiyasi.
;
; Nima uchun kerak: ApplyIndexRows (push kanali), Realizations, Transaction,
; OrgDebit joblari navbatga tushadi; QUEUE_CONNECTION=database bo'lganda ularni
; doimiy ishlab turadigan worker bajaradi. Workersiz joblar `jobs` jadvalida
; yig'ilib qolaveradi.
;
; O'rnatish (server):
;   1) .env da:  QUEUE_CONNECTION=database   (eski QUEUE_DRIVER=sync o'rniga)
;      Navbat MySQL (egaz_idxdb) da yuritiladi — config/queue.php da
;      standart shunday (DB_QUEUE_CONNECTION=mysql); .env ga hech narsa
;      qo'shish shart emas, pgsql ga o'tkazish MUMKIN EMAS (u faqat replika).
;   2) jadval borligini tekshiring:  php artisan migrate  (jobs, failed_jobs)
;   3) shu faylni nusxalang:
;        cp docs/supervisor/egazindex-worker.conf /etc/supervisor/conf.d/
;      (loyiha yo'li /var/www/egazindex dan farq qilsa, quyida to'g'irlang)
;   4) supervisorctl reread && supervisorctl update
;   5) supervisorctl status egazindex-worker:*
;
; Deploy'dan keyin HAR SAFAR:  php artisan queue:restart
; (worker joriy jobni tugatib, yangi kod bilan qayta ko'tariladi — supervisor
; o'zi qayta ishga tushiradi; kill/restart shart emas).

[program:egazindex-worker]
process_name=%(program_name)s_%(process_num)02d
; DIQQAT: serverda CLI `php85` deb nomlangan (standart `php` eskiroq versiya) —
; `which php85` bilan to'liq yo'lni aniqlab yozsangiz yanada ishonchli
; (supervisor muhitida PATH qisqa bo'lishi mumkin).
command=php85 /var/www/egazindex/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
directory=/var/www/egazindex
user=www-data
numprocs=2
autostart=true
autorestart=true
; queue:restart / SIGTERM dan keyin joriy jobni tugatishga vaqt:
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=/var/www/egazindex/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
